<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceGuard – Voice Deepfake Protection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Three.js Background Canvas -->
        <canvas id="bg-canvas"></canvas>

        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1>VoiceGuard</h1>
                <p>Real‑time voice deepfake detection</p>
            </div>
            <div class="header-actions">
                <button id="dashboard-btn" class="btn btn-outline" title="View Dashboard">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="6" width="18" height="12" rx="2"/>
                        <line x1="9" y1="8" x2="9" y2="14"/>
                        <line x1="12" y1="10" x2="12" y2="14"/>
                        <line x1="15" y1="12" x2="15" y2="14"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Call Card -->
        <main class="call-card">
            <!-- Caller Info -->
            <section class="caller-info">
                <div class="avatar">
                    <img src="https://via.placeholder.com/80" alt="Caller Avatar">
                </div>
                <div class="details">
                    <h2 class="name">John Doe</h2>
                    <p class="number">+1 (555) 123‑4567</p>
                </div>
            </section>

            <!-- Call Status -->
            <section class="call-status">
                <div class="status-indicator">
                    <div class="status-dot" id="status-dot"></div>
                    <span class="status-text" id="status-text">Monitoring call…</span>
                </div>
                <div class="timer" id="call-timer">00:00</div>
            </section>

            <!-- Audio Visualizer -->
            <section class="audio-viz">
                <div class="waveform">
                    <div class="wave" id="wave1"></div>
                    <div class="wave" id="wave2"></div>
                    <div class="wave" id="wave3"></div>
                    <div class="wave" id="wave4"></div>
                    <div class="wave" id="wave5"></div>
                </div>
            </section>

            <!-- Controls -->
            <section class="call-controls">
                <button id="settings-btn" class="btn btn-secondary" title="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12" y2="16"/>
                    </svg>
                </button>
                <button id="end-call-btn" class="btn btn-danger" title="End Call">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.18 4H1a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2h3s1-1 1.42-.58L15 6.66a3 3 0 0 1 4.24 0l1.58 1.58s1-1 1.42-.58h3a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2z"/>
                    </svg>
                </button>
            </section>
        </main>

        <!-- VoiceGuard Alert Banner (hidden by default) -->
        <div class="alert-banner" id="voiceguard-alert" role="alert" aria-live="polite">
            <div class="alert-content">
                <div class="alert-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2l3.09 6.26h5.91L12 17.27l-6.18 2.78h5.91L12 2z"/>
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12" y2="16.01"/>
                    </svg>
                </div>
                <div class="alert-message">
                    <h3>⚠️ Synthetic Voice Likely Detected</h3>
                    <p>The caller's voice may be AI‑generated. Exercise caution.</p>
                </div>
                <div class="alert-actions">
                    <button id="flag-number-btn" class="btn btn-outline">Flag Number</button>
                    <button id="end-call-alert-btn" class="btn btn-danger">End Call</button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            <p>VoiceGuard • Protecting your voice in real‑time</p>
        </footer>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
