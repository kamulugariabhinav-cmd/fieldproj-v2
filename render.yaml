services:
  - type: web
    name: voiceguard-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python backend.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: VOICEGUARD_MODEL
        value: AASIST-L
      - key: VOICEGUARD_THRESHOLD
        value: 0.50
      - key: ALLOWED_ORIGINS
        value: "*"
